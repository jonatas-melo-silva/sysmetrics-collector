name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Conferir se a tag bate com o arquivo VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag_version" != "$file_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} difere de VERSION (${file_version})" >&2
            exit 1
          fi
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck shfmt
      - name: Lint e testes
        run: make check
      - name: Empacotar
        run: |
          name="sysmetrics-collector-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$GITHUB_REF_NAME"
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "sysmetrics-collector-${GITHUB_REF_NAME#v}.tar.gz" \
            --title "$GITHUB_REF_NAME" --generate-notes
