name: Bug
description: Algo não funciona como o esperado
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: "E o que você esperava que acontecesse."
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: "Comando executado e variáveis SYSMETRICS_* definidas."
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      description: "Saída de `sysmetrics-collector --version`"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operacional
      description: "Ex.: Pop!_OS 22.04, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Mensagens de erro
      render: text
